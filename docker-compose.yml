services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
    # Subcommand in command, not entrypoint, so `compose run migrate down`
    # overrides it instead of appending to it.
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # KC_HOSTNAME fixes the issuer the tokens carry, so a token fetched from the
  # host is the same token the api container verifies; the api still fetches the
  # metadata over the Compose network via OIDC_DISCOVERY_URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    # The image ships no curl; bash talks to the management port directly.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost:localhost\\r\\nConnection:close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Only the outbound destination exists so far; the inbound queues arrive with
  # the consumer.
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-15s}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/wagering}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/wagering}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wagering-api}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      OUTBOX_QUEUE_URL: ${OUTBOX_QUEUE_URL:-http://localstack:4566/000000000000/wager-events.fifo}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      REFERENCE_POLL_INTERVAL: ${REFERENCE_POLL_INTERVAL:-1s}
      REFERENCE_BATCH_SIZE: ${REFERENCE_BATCH_SIZE:-100}
      REFERENCE_TTL: ${REFERENCE_TTL:-24h}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # SHUTDOWN_TIMEOUT plus slack, before Compose escalates to SIGKILL (§4).
    stop_grace_period: 20s

volumes:
  postgres-data:
