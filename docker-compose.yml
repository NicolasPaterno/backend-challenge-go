# Local environment for the wagering service (§4).
# Keycloak and LocalStack join in the auth and SQS stories.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: the API waits for it, so the schema is current before traffic.
  migrate:
    build:
      context: .
    # Subcommand in command, not entrypoint, so `compose run migrate down`
    # overrides it instead of appending to it.
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-15s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # SHUTDOWN_TIMEOUT plus slack, before Compose escalates to SIGKILL (§4).
    stop_grace_period: 20s

volumes:
  postgres-data:
